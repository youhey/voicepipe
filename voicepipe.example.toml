[render]
input = "samples/episode.json"
output = "dist/record/episode.mp3"
workdir = "work/record/episode"

[preview]
input = "samples/episode.json"
output = "dist/preview/preview.mp3"
workdir = "work/preview"

[upstream]
episode_url = "https://upstream.example.com/api/episodes"
# access_token = "replace-with-local-token-or-use-env"

[downstream]
upload_url = "https://downstream.example.com/api/episodes"
# access_token = "replace-with-local-token-or-use-env"

[daemon]
mode = "schedule"
interval = 300

[daemon.schedule]
enabled = true
timezone = "Asia/Tokyo"
times = ["09:00", "14:00"]

[onair]
database = "dist/onair/onair.sqlite"
episodes_dir = "dist/onair/episodes"
work_dir = "work/onair"

[keepalive]
enabled = true
urls = [
  "https://upstream.example.com",
  "https://downstream.example.com",
]
interval = 120
timeout = 10

[storage]
root_dir = "dist"
json_dir = "dist/json"
audio_dir = "dist/record"
preview_dir = "dist/preview"

[voicevox]
endpoint = "http://voicevox:50021"
speaker = 3

[voice]
speed_scale = 1.2
pitch_scale = 0.0
intonation_scale = 0.9
pause_length_scale = 1.3
volume_scale = 1.0

[audio]
bitrate = "192k"
format = "mp3"
